# Bellhop — Container Default Configuration (/config/config.yaml)
# Auto-seeded on first container startup when /config/config.yaml does not exist.
#
# Mount points inside the container:
#   /config       -> config.yaml and optional credentials.yaml
#   /data/state   -> lineup & catalog snapshots, channel_mapping.json, sd_token.json
#   /data/cache   -> Web Guide EPG cache & persistent session signing key
#   /data/output  -> bellhop.m3u8, lineup_report.json, and xtream/*.json
#
# Credentials can be provided via environment variables (.env / docker-compose.yml)
# or placed in /config/credentials.yaml.

# =============================================================================
# 1. HOST & INFRASTRUCTURE (Config file only — NOT editable in Web UI)
# =============================================================================
credentials_file: "/config/credentials.yaml"

paths:
  cache_dir: "/data/cache"
  state_dir: "/data/state"
  mapping_path: "/data/state/channel_mapping.json"
  lineup_file: "/app/data/lineups/bell_fibe_montreal.yaml"
  m3u8_playlist_path: "/data/output/bellhop.m3u8"
  m3u8_report_path: "/data/output/lineup_report.json"
  xtream_output_dir: "/data/output/xtream"
  seed_json: null
  xmltv_file: null

web_server:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  settle_ms: 180
  # Web Guide login credentials (leave blank to disable login)
  username: "${BELLHOP_WEB_USERNAME}"
  password: "${BELLHOP_WEB_PASSWORD}"
  session_ttl_hours: 168.0
  session_secret: "${BELLHOP_WEB_SESSION_SECRET}"
  # Reverse-proxy X-Forwarded-For trust (config-file only, never surfaced in Web UI)
  trust_proxy_headers: false
  trusted_proxy_ips:
    - "127.0.0.1"
    - "::1"

# =============================================================================
# 2. OPERATIONAL SETTINGS (Editable via Web UI Settings panel; no credentials)
# =============================================================================
upstream_xtream:
  server_url: "${XTREAM_SERVER_URL}"
  username: "${XTREAM_USERNAME}"
  password: "${XTREAM_PASSWORD}"
  stream_format: "ts"
  request_timeout_sec: 90.0
  refresh_hours: 24.0

xtream_server:
  enabled: true
  host: null
  port: null
  # Client credentials for IPTV players connecting to /player_api.php, /get.php, /live/*
  username: "${BELLHOP_SERVE_USERNAME}"
  password: "${BELLHOP_SERVE_PASSWORD}"
  public_host: null
  public_port: null
  server_protocol: "http"

pipeline:
  lineup:
    backend: "auto"
    lineup_id: "CAN-BELLFIBE-MTL-X"
    postal_code: "H2Y"
    refresh_days: 30.0
    numbering_mode: "both"
    collapse_sd_dupes: true
    exclude_audio: false
    pinned_streams: {}
    excluded_channels: []
    tvguide:
      base_url: "https://backend.tvguide.com/tvschedules/tvguide"
    schedules_direct:
      username: "${SD_USERNAME}"
      password: "${SD_PASSWORD}"
      base_url: "https://json.schedulesdirect.org/20141201"
      auto_add_lineup: false
    iptv_org:
      enabled: true
      base_url: "https://iptv-org.github.io/api"
      recheck_hours: 24.0

  matching:
    upgrade_hysteresis_score: 5.0

  validation:
    enabled: true
    only_changed: true
    concurrency: 2
    ignore_account_limit: false
    inter_probe_delay_sec: 0.35
    http_timeout_sec: 8.0
    min_bytes_to_read: 8192
    use_ffprobe: true
    ffprobe_timeout_sec: 12.0
    detect_black_screen: true
    black_sample_sec: 1.5
    check_audio_language: true
    max_candidates_per_channel: 5

  epg:
    verify: true
    refresh_hours: 6.0

  output:
    m3u8_enabled: true
    xtream_enabled: true
    include_unmatched_comment: false
