# Bellhop — Container Default Configuration (/config/config.yaml)
# Auto-seeded on first container startup when /config/config.yaml does not exist.
#
# Mount points inside the container:
#   /config       -> config.yaml and credentials.yaml
#   /data/state   -> lineup & catalog snapshots and channel_mapping.json
#   /data/cache   -> SQLite EPG store (epg.sqlite3), sd_token.json, & session_secret.key
#   /data/output  -> lineup_report.json and xtream/*.json

credentials_file: "/config/credentials.yaml"

paths:
  cache_dir: "/data/cache"
  state_dir: "/data/state"
  mapping_path: "/data/state/channel_mapping.json"
  lineup_file: "/app/data/lineups/bell_fibe_montreal.yaml"
  report_path: "/data/output/lineup_report.json"
  xtream_output_dir: "/data/output/xtream"
  seed_json: null
  xmltv_file: null

web_server:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  settle_ms: 180
  session_ttl_hours: 168.0
  trust_proxy_headers: false
  trusted_proxy_ips:
    - "127.0.0.1"
    - "::1"

xtream_server:
  enabled: true
  host: null
  port: null
  public_host: null
  public_port: null
  server_protocol: "http"

upstream_xtream:
  server_url: "http://provider.example:8080"
  stream_format: "ts"
  request_timeout_sec: 90.0
  refresh_hours: 24.0

pipeline:
  lineup:
    backend: "auto"
    lineup_id: "CAN-BELLFIBE-MTL-X"
    postal_code: ""
    refresh_days: 30.0
    numbering_mode: "both"
    collapse_sd_dupes: true
    exclude_audio: false
    pinned_streams: {}
    excluded_channels: []
    schedules_direct:
      auto_add_lineup: false
    iptv_org:
      enabled: true
      recheck_hours: 24.0

  matching:
    upgrade_hysteresis_score: 5.0

  validation:
    enabled: true
    only_changed: true
    concurrency: 2
    ignore_account_limit: false
    inter_probe_delay_sec: 0.35
    http_timeout_sec: 8.0
    min_bytes_to_read: 8192
    use_ffprobe: true
    ffprobe_timeout_sec: 12.0
    detect_black_screen: true
    black_sample_sec: 1.5
    check_audio_language: true
    max_candidates_per_channel: 5

  epg:
    verify: true
    refresh_hours: 6.0

  output:
    include_unmatched_comment: false
