# Bellhop — Container Default Credentials (/config/credentials.yaml)
# Auto-seeded on first container startup when /config/credentials.yaml does not exist.
# Replace these placeholder values with your real email, password, and upstream
# provider credentials before running `bellhop run` or serving streams.

accounts:
  admin:
    email: "admin@example.com"
    web_password: "change_me_web"
    upstream_username: "your_upstream_username"
    upstream_password: "your_upstream_password"
    pipeline: true

# Optional: powers Schedules Direct SD-JSON EPG priority listings & `schedules_direct` backend
# schedules_direct:
#   username: ""
#   password: ""
#   auto_add_lineup: false

# Optional: outbound email SMTP login (Google Workspace / Gmail App Password)
# email:
#   username: ""
#   password: ""
