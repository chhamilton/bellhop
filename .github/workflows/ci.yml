name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test (Python + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install ffmpeg for Phase 4 codec & black-frame tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python runtime & dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"

      - name: Install TypeScript frontend toolchain
        run: npm ci --no-audit --no-fund

      - name: Run full non-Docker verification suite (ruff, mypy --strict, tsc, Node, pytest + branch coverage >= 85%)
        run: pytest -m "not docker" -v

  docker-e2e:
    name: Alpine Docker Container E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-typecheck-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"

      - name: Build Alpine image & run end-to-end container tests
        env:
          BELLHOP_REQUIRE_DOCKER: "1"
        run: pytest -m docker -v
