# Dedicated Provider & Server Credentials Example
# Copy to `credentials.yaml` and fill in your credentials.

# Upstream Xtream Codes IPTV provider credentials
xtream:
  url: "example.provider.com:8080"
  username: "your_username"
  password: "your_password"
  stream_format: "ts"

# Optional: powers Schedules Direct SD-JSON EPG priority listings & `schedules_direct` lineup backend
schedules_direct:
  username: ""
  password: ""
  auto_add_lineup: false

# Optional: distinct login credentials for Web Guide UI (`web_server`) and Xtream API (`xtream_server`)
web_server:
  username: "admin"
  password: "change_me_web"

xtream_server:
  username: "my_xtream_user"
  password: "change_me_xtream"
