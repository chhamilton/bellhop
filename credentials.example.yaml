# Multi-Account & Provider Credentials Example
# Copy to `credentials.yaml` (`chmod 600 credentials.yaml`) and fill in your values.
#
# Notes:
#   - `web_password` is automatically scrypt-hashed into `web_password_hash` and
#     removed from this file on the next `bellhop` run or `serve` startup.
#   - Omit `xtream_username` / `xtream_password` to auto-generate random 8-char
#     lowercase alphanumeric credentials (`[a-z0-9]{8}`), or supply custom ones.
#   - `pipeline: true` marks account(s) eligible for `bellhop run` catalog fetch &
#     candidate stream validation (defaults to the first account if none marked).

accounts:
  admin:
    email: "admin@example.com"
    web_password: "change_me_web_password"
    # Optional custom Bellhop Xtream login (auto-generated as 8-char [a-z0-9] if omitted):
    # xtream_username: ""
    # xtream_password: ""
    upstream_username: "your_upstream_username"
    upstream_password: "your_upstream_password"
    pipeline: true

# Example second household tuner account (uses its own upstream IPTV login):
#  family:
#    email: "family@example.com"
#    web_password: "change_me_family_password"
#    upstream_username: "family_upstream_username"
#    upstream_password: "family_upstream_password"

# Optional: powers Schedules Direct SD-JSON EPG priority listings & `schedules_direct` backend
schedules_direct:
  username: ""
  password: ""
  auto_add_lineup: false

# Optional: outbound email SMTP login (for Google Workspace / Gmail App Passwords)
# Enable under `email:` in config.yaml and generate a dedicated App Password.
email:
  username: ""
  password: ""
