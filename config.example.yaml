# Bellhop — Declarative Lineup Pipeline & Server Configuration
# Copy this file to `config.yaml` and `credentials.example.yaml` to `credentials.yaml`.
# Both files are required; credentials live strictly in `credentials.yaml`.

credentials_file: "credentials.yaml"

paths:
  cache_dir: "cache"
  state_dir: "state"
  mapping_path: "state/channel_mapping.json"
  # Bundled sample YAML definition used when pipeline.lineup.backend="yaml" (or auto with CAN-BELLFIBE-MTL-X)
  lineup_file: "data/lineups/bell_fibe_montreal.yaml"
  # Phase (5) diagnostics report & Xtream JSON export directory
  report_path: "output/lineup_report.json"
  xtream_output_dir: "output/xtream"
  # Optional offline local overrides (primarily for testing)
  seed_json: null
  xmltv_file: null

web_server:
  # Web Guide UI HTTP server bind address, port, session TTL, and tuner settle delay.
  # "0.0.0.0" binds all interfaces (device LAN IP + localhost); "auto" binds to the detected LAN IP;
  # "127.0.0.1" restricts access to localhost only; or set an explicit IP address.
  enabled: true
  host: "0.0.0.0"
  port: 8080
  # Single-tuner settle delay (ms) between closing one live browser stream and opening another
  settle_ms: 180
  # Sliding session cookie lifetime (hours; default 168h = 7 days).
  # Signing secret is auto-generated at `cache/session_secret.key` (delete it live to revoke all sessions).
  session_ttl_hours: 168.0
  # Optional allowlist of external/internal base URLs for outbound email links and reverse proxies
  # (e.g. ["https://tv.yourdomain.com", "http://192.168.1.50:8080"]).
  # Matched per-request with fallback to the first entry (or the bound LAN address when empty).
  public_base_urls: []
  # Reverse-proxy client IP handling:
  trust_proxy_headers: false
  trusted_proxy_ips:
    - "127.0.0.1"
    - "::1"

xtream_server:
  # Passthrough Xtream Codes API & dynamic M3U8 server (`bellhop serve`)
  # Leave host/port null to co-exist on the `web_server` listener (0.0.0.0:8080),
  # or set explicit values to bind the Xtream API on a dedicated port/interface.
  enabled: true
  host: null
  port: null
  # Optional public host/port advertised in Xtream `server_info` and Account & Player Setup UI
  public_host: null
  public_port: null
  server_protocol: "http"

upstream_xtream:
  # Shared upstream Xtream Codes IPTV provider server URL & transport format
  # (per-account upstream usernames & passwords live under `accounts:` in credentials.yaml)
  server_url: "http://provider.example:8080"
  stream_format: "ts"
  request_timeout_sec: 90.0
  # Phase (2) `catalog`: Daily IPTV playlist fetch cadence (hours)
  refresh_hours: 24.0

pipeline:
  lineup:
    # Phase (1) `lineup` Backend: "auto", "tvguide" (free US/CA JSON), "schedules_direct" (SD-JSON), or "yaml"
    backend: "auto"
    lineup_id: "CAN-BELLFIBE-MTL-X"
    postal_code: ""
    refresh_days: 30.0
    # Channel numbering mode: "both" (100s SD + 1000s HD), "hd", or "sd"
    numbering_mode: "both"
    collapse_sd_dupes: true
    exclude_audio: false
    pinned_streams: {}
    excluded_channels: []
    schedules_direct:
      auto_add_lineup: false
    iptv_org:
      enabled: true
      recheck_hours: 24.0

  matching:
    upgrade_hysteresis_score: 5.0

  validation:
    enabled: true
    only_changed: true
    concurrency: 2
    ignore_account_limit: false
    inter_probe_delay_sec: 0.35
    http_timeout_sec: 8.0
    min_bytes_to_read: 8192
    use_ffprobe: true
    ffprobe_timeout_sec: 12.0
    detect_black_screen: true
    black_sample_sec: 1.5
    check_audio_language: true
    max_candidates_per_channel: 5

  epg:
    verify: true
    refresh_hours: 6.0

  output:
    include_unmatched_comment: false

email:
  # Outbound SMTP email (Google Workspace / Gmail App Password or generic SMTP)
  # Put SMTP username + 16-char App Password under `email:` in credentials.yaml.
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  # "starttls" (port 587), "ssl" (port 465), or "none" (loopback relay only)
  tls_mode: "starttls"
  from_name: "Bellhop"
  # Defaults to `email.username` from credentials.yaml when empty
  from_address: ""
  timeout_sec: 15.0
