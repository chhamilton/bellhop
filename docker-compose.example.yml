# Bellhop — Example Docker Compose Configuration
# Copy `.env.example` -> `.env`, `docker-compose.example.yml` -> `docker-compose.yml`,
# and populate `./docker-data/config/config.yaml` & `./docker-data/config/credentials.yaml`,
# then run:
#   docker compose up -d --build
#
# To run the 5-phase pipeline inside the running container:
#   docker compose exec bellhop bellhop run --skip validate

services:
  bellhop:
    build:
      context: .
      dockerfile: Dockerfile
    image: bellhop:latest
    container_name: bellhop
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Timezone & non-root file ownership (mapped to host user/group IDs)
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

      # Internal mount points (matching volumes below)
      BELLHOP_CONFIG_DIR: /config
      BELLHOP_STATE_DIR: /data/state
      BELLHOP_CACHE_DIR: /data/cache
      BELLHOP_OUTPUT_DIR: /data/output
      BELLHOP_CONFIG: /config/config.yaml
    ports:
      - "${BELLHOP_PORT:-8080}:8080"
    volumes:
      # Required file-backed config.yaml & credentials.yaml (auto-seeded on first boot)
      - ./docker-data/config:/config
      # Stateful lineup/catalog snapshots & channel_mapping.json
      - ./docker-data/state:/data/state
      # Web Guide SQLite EPG cache, sd_token.json & session_secret.key
      - ./docker-data/cache:/data/cache
      # Lineup diagnostics report & exported Xtream JSON bundle
      - ./docker-data/output:/data/output
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
